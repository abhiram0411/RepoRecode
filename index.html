<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151916" />
    <meta
      name="description"
      content="Understand your code. Rebuild it with confidence. A private, source-grounded codebase learning workspace."
    />
    <title>RepoRecode — Learn your own code</title>
    <style>
      body {
        margin: 0;
      }
      .startup {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 48px 24px;
        background: #151916;
        color: #edf2e8;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      .startup h1 {
        font-size: 24px;
      }
      .startup a {
        color: #c5ed83;
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="startup">
        <h1>Opening RepoRecode</h1>
        <p>
          Your learning workspace is loading. If this message stays here, check
          your connection and reload.
        </p>
        <a href="/">Reload the workspace</a>
        <noscript
          ><p>
            JavaScript is required to open the workspace and run local practice.
            Enable it in your browser, then reload.
          </p></noscript
        >
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
