name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Standard public-repository runners are free. Never run this workflow
    # if the repository is made private; no billed caches/artifacts are used.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - run: node scripts/check-hosted-entry.mjs
      - run: npm audit --audit-level=high
      - run: node scripts/scan-source.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          LOCAL_COMMUNITY_E2E: 'true'
      - name: Verify local development runtime
        run: npx playwright test e2e/inherited-inputs.spec.ts e2e/generic-async-practice.spec.ts e2e/preview.spec.ts --reporter=list,json
        env:
          PLAYWRIGHT_DEV: 'true'
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/dev-browser-results.json
